<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1524"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <pattern id="stallDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .stitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
    .ssub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #CBD5E1; }
  </style>

  <rect width="1100" height="420" rx="12" fill="url(#stallBg)"/>
  <rect width="1100" height="420" rx="12" fill="url(#stallDots)"/>
  <rect width="1100" height="420" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(35, 35)">
    <text class="stitle" x="0" y="0">📈 Stall Detection: Empirical Rule Selection (§8)</text>
    <text class="ssub" x="0" y="18">Why the naive "No PR in 3–4 weeks" rule failed • Least-squares slope over 56 days</text>
  </g>

  <!-- Side-by-Side: The Naive Rule vs The Scientific Least Squares Rule -->
  <g transform="translate(35, 80)">
    <!-- Naive Rule -->
    <rect x="0" y="0" width="490" height="295" rx="8" fill="#111827" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="15" y="15" width="165" height="22" rx="4" fill="#7F1D1D"/>
    <text class="mono" x="97" y="30" fill="#FCA5A5" text-anchor="middle" font-weight="700">❌ REJECTED PR RULE</text>
    <text class="ssub" x="15" y="55">Flag if no all-time best e1RM within trailing 21–28 days.</text>

    <g transform="translate(15, 75)">
      <!-- Line chart simulation showing false alarms -->
      <path d="M 0 100 L 60 80 L 120 85 L 180 60 L 240 65 L 300 40 L 360 45 L 420 20" stroke="#EF4444" stroke-width="2.5" fill="none"/>
      <!-- Shaded false alarms -->
      <rect x="60" y="20" width="55" height="90" fill="#EF4444" fill-opacity="0.25"/>
      <rect x="180" y="20" width="55" height="90" fill="#EF4444" fill-opacity="0.25"/>
      <rect x="300" y="20" width="55" height="90" fill="#EF4444" fill-opacity="0.25"/>
      <text class="mono" x="65" y="125" fill="#F87171" font-size="9">False Stall!</text>
      <text class="mono" x="185" y="125" fill="#F87171" font-size="9">False Stall!</text>
      <text class="mono" x="305" y="125" fill="#F87171" font-size="9">False Stall!</text>

      <rect x="0" y="145" width="460" height="60" rx="4" fill="#0F172A" stroke="#1E293B"/>
      <text class="mono" x="10" y="165" fill="#FCA5A5">• Bench press rose 42kg → 64kg, yet flagged 61% of workouts!</text>
      <text class="ssub" x="10" y="185" fill="#9CA3AF">PRs naturally occur in bursts; session noise is 2.8%–6.1%.</text>
    </g>

    <!-- Scientific 56-day LS rule -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="510" height="295" rx="8" fill="#111827" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="15" y="15" width="180" height="22" rx="4" fill="#065F46"/>
      <text class="mono" x="105" y="30" fill="#A7F3D0" text-anchor="middle" font-weight="700">✓ 56-DAY SLOPE RULE</text>
      <text class="ssub" x="15" y="55">Least-squares fit of e1RM vs weeks: slope &lt; 0.0%/wk (min 4 sessions).</text>

      <g transform="translate(15, 75)">
        <!-- Upward trend with noise -->
        <path d="M 0 95 L 60 78 L 120 83 L 180 58 L 240 62 L 300 38 L 360 42 L 420 18" stroke="#10B981" stroke-width="2.5" fill="none"/>
        <!-- Trend line -->
        <line x1="0" y1="95" x2="420" y2="20" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text class="mono" x="220" y="45" fill="#34D399" font-size="10">Positive Slope (+0.8%/wk) → NOT Stalled</text>

        <rect x="0" y="145" width="480" height="60" rx="4" fill="#0F172A" stroke="#1E293B"/>
        <text class="mono" x="10" y="165" fill="#A7F3D0">• High discrimination ratio (2.1x) inside genuine plateaus</text>
        <text class="ssub" x="10" y="185" fill="#9CA3AF">Filters single bad days (−15%) and planned deloads (−10%) correctly.</text>
      </g>
    </g>
  </g>
</svg>
