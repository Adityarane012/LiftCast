<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1524"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <pattern id="plateDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
    </pattern>
    <marker id="arrow-amber2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    .ptitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
    .psub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; }
  </style>

  <rect width="1100" height="360" rx="12" fill="url(#plateBg)"/>
  <rect width="1100" height="360" rx="12" fill="url(#plateDots)"/>
  <rect width="1100" height="360" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(35, 35)">
    <text class="ptitle" x="0" y="0">🏋️ Inverted Working Weight &amp; Visual Plate Loader Flow</text>
    <text class="psub" x="0" y="18">Transforming abstract e1RM forecasts into gym-floor barbell loading (20kg bar + 2.5kg plates)</text>
  </g>

  <!-- Flow Steps -->
  <g transform="translate(35, 80)">
    <!-- Step 1: Forecasted e1RM -->
    <rect x="0" y="20" width="200" height="110" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
    <text class="mono" x="15" y="45" fill="#A78BFA" font-weight="700">1. TabPFN Forecast</text>
    <text class="mono" x="15" y="70" fill="#F8FAFC" font-size="16">e1RM = 82.5 kg</text>
    <text class="mono" x="15" y="92" fill="#94A3B8" font-size="10">Target: 8 reps</text>
    <text class="mono" x="15" y="108" fill="#6D28D9" font-size="9">In-context prior</text>

    <!-- Arrow 1 -->
    <path d="M 200 75 L 245 75" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow-amber2)"/>

    <!-- Step 2: Epley Inversion -->
    <rect x="255" y="20" width="210" height="110" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text class="mono" x="15" y="45" fill="#34D399" font-weight="700">2. Epley Inversion</text>
    <text class="mono" x="15" y="68" fill="#CBD5E1" font-size="10">weight = e1RM / (1 + r/30)</text>
    <text class="mono" x="15" y="88" fill="#F8FAFC" font-size="14">Raw: 65.13 kg</text>
    <text class="mono" x="15" y="108" fill="#10B981" font-size="10">Snap to 2.5kg: 65.0 kg</text>

    <!-- Arrow 2 -->
    <path d="M 465 75 L 510 75" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow-amber2)"/>

    <!-- Step 3: Sleeve Calculation -->
    <rect x="520" y="20" width="220" height="110" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
    <text class="mono" x="15" y="45" fill="#FBBF24" font-weight="700">3. Per-Side Bar Math</text>
    <text class="mono" x="15" y="68" fill="#CBD5E1" font-size="10">(65kg - 20kg bar) / 2</text>
    <text class="mono" x="15" y="88" fill="#F8FAFC" font-size="14">= 22.5 kg per sleeve</text>
    <text class="mono" x="15" y="108" fill="#F59E0B" font-size="10">Greedy decomposition</text>

    <!-- Arrow 3 -->
    <path d="M 740 75 L 785 75" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow-amber2)"/>

    <!-- Step 4: Visual Sleeve Graphic -->
    <g transform="translate(795, 10)">
      <rect x="0" y="10" width="235" height="130" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text class="mono" x="12" y="32" fill="#F8FAFC" font-weight="700">4. Visual Barbell Sleeve</text>

      <!-- Barbell graphic -->
      <g transform="translate(15, 50)">
        <!-- Collar/Shaft -->
        <rect x="0" y="24" width="40" height="12" fill="#64748B"/>
        <rect x="35" y="10" width="10" height="40" rx="2" fill="#475569"/>
        <!-- Sleeve -->
        <rect x="45" y="26" width="160" height="8" fill="#94A3B8"/>
        <!-- 20kg Blue Plate -->
        <rect x="55" y="4" width="16" height="52" rx="3" fill="#2563EB" stroke="#1D4ED8"/>
        <text class="mono" x="63" y="34" fill="#FFFFFF" font-size="8" text-anchor="middle">20</text>
        <!-- 2.5kg Green Plate -->
        <rect x="74" y="18" width="10" height="24" rx="2" fill="#16A34A" stroke="#15803D"/>
        <text class="mono" x="79" y="33" fill="#FFFFFF" font-size="7" text-anchor="middle">2.5</text>
      </g>

      <text class="mono" x="12" y="125" fill="#34D399" font-size="10">Per side: [20kg, 2.5kg]</text>
    </g>
  </g>

  <!-- Bottom Audio & Chalk Note -->
  <g transform="translate(35, 255)">
    <rect x="0" y="0" width="1030" height="70" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text class="mono" x="18" y="28" fill="#FBBF24" font-weight="700">🎙️ Gym Floor Usability: Zero Touch Required</text>
    <text class="psub" x="18" y="48">Armaan doesn't have to fiddle with phone sliders or mental arithmetic with chalky hands. In addition to the visual plate graphic,</text>
    <text class="psub" x="18" y="64">ElevenLabs voice coach delivers this directly to his earbuds: "Next bench target: 65 kg for 8 reps. Load one 20 and one 2.5 on each side."</text>
  </g>
</svg>
